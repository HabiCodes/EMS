<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Cinema - EntryMySlot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }, colors: { custom: { light: '#FA580B', dark: '#0126A5' } } } }
        }
    </script>
    <style>
        .time-pill { border: 1px solid #e5e7eb; border-radius: 8px; padding: 6px 12px; font-size: 0.875rem; font-weight: 600; color: #111827; cursor: pointer; transition: all 0.2s; background: white;}
        .time-pill:hover { border-color: #FA580B; color: #FA580B; background: #fff5f0; }
        .time-pill.fast-filling { color: #d97706; border-color: #fcd34d; background: #fffbeb; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900 min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <button onclick="history.back()" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 hover:bg-gray-200 transition"><i class="fa-solid fa-arrow-left"></i></button>
                <div>
                    <h1 id="headerMovieTitle" class="text-xl font-extrabold leading-tight">Loading...</h1>
                    <p class="text-xs text-gray-500 font-medium">Tamil &bull; 2D</p>
                </div>
            </div>
        </div>
    </header>

    <div class="bg-white border-b border-gray-200 sticky top-14 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-2 flex overflow-x-auto gap-3 hide-scrollbar" id="dateSelector">
            <!-- Populated by JS -->
        </div>
    </div>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-6 w-full">
        
        <!-- Filters Area -->
        <div class="flex flex-wrap gap-2 mb-6 border-b border-gray-200 pb-4">
            <span class="text-sm font-bold text-gray-700 flex items-center mr-2">Filter By:</span>
            <span class="px-3 py-1 bg-white border border-gray-200 rounded-full text-xs font-bold cursor-pointer hover:border-custom-light">Tamil</span>
            <span class="px-3 py-1 bg-white border border-gray-200 rounded-full text-xs font-bold cursor-pointer hover:border-custom-light">0-200 Rs</span>
            <span class="px-3 py-1 bg-white border border-gray-200 rounded-full text-xs font-bold cursor-pointer hover:border-custom-light flex items-center gap-1"><i class="fa-solid fa-wheelchair text-[10px]"></i> Wheelchair</span>
        </div>

        <div id="cinemasList" class="space-y-4">
            <!-- Cinema Card Template (Injected via JS) -->
        </div>

    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const movieTitle = urlParams.get('title') || 'Selected Movie';
        document.getElementById('headerMovieTitle').textContent = movieTitle;

        // Generate Dates
        const dateSelector = document.getElementById('dateSelector');
        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        let today = new Date();
        
        for(let i=0; i<5; i++) {
            let d = new Date(today);
            d.setDate(d.getDate() + i);
            
            let isToday = i === 0;
            let displayDay = isToday ? 'TODAY' : days[d.getDay()];
            let displayDate = d.getDate();
            let displayMonth = months[d.getMonth()];

            let btn = document.createElement('button');
            btn.className = `flex-shrink-0 flex flex-col items-center justify-center w-14 h-16 rounded-xl transition ${isToday ? 'bg-custom-light text-white shadow-md' : 'bg-white text-gray-600 hover:bg-gray-100'}`;
            btn.innerHTML = `<span class="text-[10px] font-bold uppercase tracking-wider">${displayDay}</span><span class="text-lg font-extrabold leading-tight">${displayDate}</span><span class="text-[10px] font-medium">${displayMonth}</span>`;
            
            // Basic selection logic
            btn.onclick = function() {
                document.querySelectorAll('#dateSelector button').forEach(b => {
                    b.classList.remove('bg-custom-light', 'text-white', 'shadow-md');
                    b.classList.add('bg-white', 'text-gray-600');
                });
                this.classList.remove('bg-white', 'text-gray-600');
                this.classList.add('bg-custom-light', 'text-white', 'shadow-md');
            };
            
            dateSelector.appendChild(btn);
        }

        // Generate Mock Cinemas
        const cinemasData = [
            { id: 'c1', name: 'KG Cinemas: Race Course', facilities: ['M-Ticket', 'F&B'], times: [{t: '10:30 AM', s: 'available'}, {t: '01:45 PM', s: 'fast'}, {t: '05:15 PM', s: 'available'}, {t: '10:00 PM', s: 'available'}] },
            { id: 'c2', name: 'PVR: Prozone Mall', facilities: ['M-Ticket', 'Parking'], times: [{t: '11:00 AM', s: 'available'}, {t: '02:30 PM', s: 'available'}, {t: '06:45 PM', s: 'fast'}, {t: '10:30 PM', s: 'available'}] },
            { id: 'c3', name: 'INOX: Brookefields', facilities: ['M-Ticket', 'F&B', 'Wheelchair'], times: [{t: '09:00 AM', s: 'available'}, {t: '12:15 PM', s: 'available'}, {t: '04:00 PM', s: 'available'}, {t: '08:15 PM', s: 'fast'}] },
        ];

        const listContainer = document.getElementById('cinemasList');
        
        cinemasData.forEach(cinema => {
            let timesHtml = cinema.times.map(timeObj => {
                let extraClass = timeObj.s === 'fast' ? 'fast-filling' : '';
                return `<button onclick="selectTime('${cinema.name}', '${timeObj.t}')" class="time-pill ${extraClass}">${timeObj.t}</button>`;
            }).join('');

            let facilitiesHtml = cinema.facilities.map(f => `<span class="text-[10px] text-green-600 font-bold flex items-center gap-1"><i class="fa-solid fa-check text-[8px]"></i> ${f}</span>`).join('');

            let card = `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row gap-4 md:items-center">
                    <div class="md:w-1/3">
                        <h3 class="font-extrabold text-lg text-gray-900 flex items-center gap-2"><i class="fa-regular fa-heart text-gray-300 hover:text-red-500 cursor-pointer transition"></i> ${cinema.name}</h3>
                        <div class="flex gap-3 mt-2">${facilitiesHtml}</div>
                    </div>
                    <div class="md:w-2/3">
                        <div class="flex flex-wrap gap-3">
                            ${timesHtml}
                        </div>
                        <div class="mt-2 text-[10px] text-gray-400 flex gap-4">
                            <span class="flex items-center gap-1"><div class="w-2 h-2 rounded-full bg-green-500"></div> Available</span>
                            <span class="flex items-center gap-1"><div class="w-2 h-2 rounded-full bg-yellow-400"></div> Fast Filling</span>
                        </div>
                    </div>
                </div>
            `;
            listContainer.innerHTML += card;
        });

        function selectTime(cinemaName, time) {
            // Encode details for seat selection page
            const d = new Date();
            const dateStr = `${d.getDate()} ${months[d.getMonth()]}`;
            window.location.href = `seats.html?movie=${encodeURIComponent(movieTitle)}&cinema=${encodeURIComponent(cinemaName)}&time=${encodeURIComponent(time)}&date=${encodeURIComponent(dateStr)}`;
        }
    </script>
</body>
</html>
