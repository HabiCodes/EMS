<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Seats - EntryMySlot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }, colors: { custom: { light: '#FA580B', dark: '#0126A5' } } } } }
    </script>
    <style>
        .seat { width: 28px; height: 28px; border: 1px solid #111827; border-radius: 6px 6px 4px 4px; cursor: pointer; transition: all 0.2s; position: relative; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: transparent; }
        .seat:hover:not(.sold) { background-color: #e5e7eb; }
        .seat.selected { background-color: #FA580B; border-color: #FA580B; color: white; }
        .seat.sold { background-color: #e5e7eb; border-color: #d1d5db; cursor: not-allowed; opacity: 0.5; }
        .seat.gap { border: none; background: transparent; cursor: default; pointer-events: none; }

        .screen-curve { width: 100%; height: 40px; border-top: 4px solid #d1d5db; border-radius: 50% 50% 0 0 / 100% 100% 0 0; margin-bottom: 2rem; position: relative; box-shadow: 0 -10px 20px -10px rgba(0,0,0,0.1); }
        .screen-text { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: bold; color: #9ca3af; letter-spacing: 2px; }

        /* Pinch to zoom area for mobile */
        .seating-area { overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 20px; }
        .seat-row { display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; align-items: center; }
        .row-label { font-size: 12px; font-weight: bold; color: #6b7280; width: 20px; text-align: right; margin-right: 10px; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900 min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <button onclick="history.back()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center hover:bg-gray-200"><i class="fa-solid fa-chevron-left"></i></button>
                <div>
                    <h1 id="movieName" class="text-base sm:text-lg font-extrabold leading-tight">Movie Name</h1>
                    <p id="cinemaDetails" class="text-xs text-gray-500 font-medium">Cinema Name | Date | Time</p>
                </div>
            </div>
            <div class="hidden sm:flex gap-4 text-xs font-bold">
                <span class="flex items-center gap-1"><div class="w-4 h-4 border border-gray-900 rounded"></div> Available</span>
                <span class="flex items-center gap-1"><div class="w-4 h-4 bg-custom-light rounded"></div> Selected</span>
                <span class="flex items-center gap-1"><div class="w-4 h-4 bg-gray-200 rounded"></div> Sold</span>
            </div>
        </div>
    </header>

    <main class="flex-grow w-full max-w-4xl mx-auto bg-white sm:my-6 sm:rounded-3xl shadow-sm sm:border border-gray-200 overflow-hidden flex flex-col relative pb-32 sm:pb-0">

        <div class="seating-area flex-grow">
            <!-- Price Categories -->
            <div id="categoriesHeader" class="text-center mb-6 mt-4"></div>
            <div id="seatsContainer"></div>

            <!-- Screen -->
            <div class="w-3/4 mx-auto mt-12 mb-4">
                <div class="screen-curve"><span class="screen-text">All eyes this way</span></div>
            </div>
        </div>

    </main>

    <div id="bottomBar" class="fixed sm:sticky bottom-0 left-0 w-full bg-white border-t border-gray-200 p-4 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] z-40 flex justify-between items-center transform translate-y-full transition-transform duration-300">
        <div>
            <p class="text-sm text-gray-500 font-medium mb-0.5"><span id="seatCount">0</span> Tickets</p>
            <p class="font-extrabold text-xl">Rs. <span id="totalAmount">0</span></p>
        </div>
        <button onclick="proceedToPayment()" class="bg-custom-light text-white px-8 py-3 rounded-xl font-bold shadow-glow hover:bg-custom-lightHover transition flex items-center gap-2">
            Pay Now
        </button>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);

        // Expect showtime_id as query parameter
        var showtimeId = urlParams.get('showtime_id') || '';

        document.getElementById('movieName').textContent = urlParams.get('movie') || 'Select Seats';
        document.getElementById('cinemaDetails').textContent = `${urlParams.get('cinema') || ''} | ${urlParams.get('date') || ''} | ${urlParams.get('time') || ''}`;

        var selectedSeats = [];
        var totalAmt = 0;
        var seatLayoutData = null;

        function updateBottomBar() {
            var bar = document.getElementById('bottomBar');
            document.getElementById('seatCount').textContent = selectedSeats.length;
            document.getElementById('totalAmount').textContent = totalAmt;

            if (selectedSeats.length > 0) {
                bar.classList.remove('translate-y-full');
            } else {
                bar.classList.add('translate-y-full');
            }
        }

        function toggleSeat(seatId, seatNum, status, pricePaise, category, rowLabel) {
            if (status === 'booked') return;
            if (status === 'held') return;

            var index = selectedSeats.findIndex(function(s) { return s.seatId === seatId; });
            if (index > -1) {
                selectedSeats.splice(index, 1);
                totalAmt -= pricePaise;
                var btn = document.querySelector('button[data-seat-id="' + seatId + '"]');
                if (btn) {
                    btn.classList.remove('selected');
                    btn.classList.add('seat-btn', 'bg-white', 'border', 'border-gray-300', 'border-b-2', 'hover:border-custom-light', 'text-transparent', 'hover:text-gray-500');
                    btn.classList.remove('bg-custom-light', 'text-white', 'border-custom-dark', 'border-b-custom-dark');
                }
            } else {
                if (selectedSeats.length >= 10) { alert('Maximum 10 seats allowed.'); return; }
                selectedSeats.push({ seatId: seatId, seatNum: seatNum, pricePaise: pricePaise, category: category, rowLabel: rowLabel });
                totalAmt += pricePaise;
                var btn = document.querySelector('button[data-seat-id="' + seatId + '"]');
                if (btn) {
                    btn.classList.add('selected', 'bg-custom-light', 'text-white', 'border-custom-dark', 'border-b-custom-dark');
                    btn.classList.remove('seat-btn', 'bg-white', 'border-gray-300', 'border-b-2', 'hover:border-custom-light', 'text-transparent', 'hover:text-gray-500');
                }
            }
            updateBottomBar();
        }

        function renderSeatLayout(layout) {
            var container = document.getElementById('seatsContainer');
            var header = document.getElementById('categoriesHeader');
            container.innerHTML = '';
            header.innerHTML = '';

            if (!layout || !layout.rows || layout.rows.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-8">No seats available.</p>';
                return;
            }

            // Collect unique categories
            var categories = {};
            layout.rows.forEach(function(row) {
                row.seats.forEach(function(s) {
                    if (s.seatCategory && !categories[s.seatCategory]) {
                        categories[s.seatCategory] = s.pricePaise;
                    }
                });
            });

            // Render category headers
            Object.keys(categories).sort().forEach(function(cat) {
                header.innerHTML += '<p class="text-xs font-bold text-gray-400 mb-2 border-b border-gray-100 pb-2 inline-block px-10">' + escapeHtml(cat) + ' - Rs. ' + (categories[cat]) + '</p>';
            });

            // Render seats grouped by row
            layout.rows.forEach(function(row) {
                var rowDiv = document.createElement('div');
                rowDiv.className = 'seat-row';
                var rowLabel = document.createElement('div');
                rowLabel.className = 'row-label';
                rowLabel.textContent = row.rowLabel;
                rowDiv.appendChild(rowLabel);

                row.seats.forEach(function(seat) {
                    var seatLabel = String(seat.seatNumber || '');
                    var seatBtn = document.createElement('button');
                    seatBtn.dataset.seatId = String(seat.seatId || 0);

                    if (seat.status === 'booked') {
                        seatBtn.className = 'seat sold';
                        seatBtn.disabled = true;
                        seatBtn.title = 'Sold';
                    } else if (seat.status === 'held') {
                        seatBtn.className = 'seat';
                        seatBtn.disabled = true;
                        seatBtn.style.backgroundColor = '#fef3c7';
                        seatBtn.style.color = '#92400e';
                        seatBtn.title = 'On Hold';
                        seatBtn.textContent = seatLabel;
                    } else {
                        seatBtn.className = 'seat seat-btn bg-white border border-gray-300 border-b-2 hover:border-custom-light text-transparent hover:text-gray-500';
                        seatBtn.textContent = seatLabel;
                        seatBtn.addEventListener('click', function() {
                            toggleSeat(
                                String(seat.seatId || 0),
                                String(seat.seatNumber || ''),
                                seat.status || 'available',
                                seat.pricePaise || 0,
                                seat.seatCategory || '',
                                row.rowLabel || ''
                            );
                        });
                    }
                    rowDiv.appendChild(seatBtn);
                });

                container.appendChild(rowDiv);
            });
        }

        function normalizeSeatLayout(layout) {
            if (!layout) return null;
            var sourceSeats = [];

            if (Array.isArray(layout.seats)) {
                sourceSeats = layout.seats;
            } else if (Array.isArray(layout.rows)) {
                layout.rows.forEach(function(row) {
                    if (row && Array.isArray(row.seats)) {
                        row.seats.forEach(function(seat) {
                            sourceSeats.push(Object.assign({ row: row.rowLabel || row.row || '' }, seat));
                        });
                    }
                });
            }

            var grouped = {};
            sourceSeats.forEach(function(seat) {
                var row = String(seat.rowLabel || seat.row_label || seat.row || '');
                if (!grouped[row]) grouped[row] = [];
                var rawStatus = String(seat.status || 'available').toLowerCase();
                grouped[row].push({
                    seatId: String(seat.seatId || seat.seat_id || seat.id || ''),
                    seatNumber: seat.seatNumber || seat.seat_number || seat.number || seat.label || '',
                    seatCategory: seat.seatCategory || seat.seat_category || seat.type || 'Standard',
                    pricePaise: Number(seat.pricePaise || seat.price_paise || seat.price || 0),
                    status: ['occupied', 'sold', 'booked'].indexOf(rawStatus) !== -1 ? 'booked' : rawStatus,
                });
            });

            return {
                rows: Object.keys(grouped).sort().map(function(row) {
                    return { rowLabel: row, seats: grouped[row] };
                }),
            };
        }

        function proceedToPayment() {
            if (selectedSeats.length === 0) return;
            if (EMS_AUTH && !EMS_AUTH.isLoggedIn()) {
                alert('Please log in to book tickets.');
                window.location.href = 'index.html';
                return;
            }

            // Hold seats first
            var seatIds = selectedSeats.map(function(s) { return s.seatId; });
            EMS_API.movies.holdSeats({
                showtime_id: showtimeId,
                seat_ids: seatIds
            }).then(function(r) {
                if (!r.ok || !r.data || !r.data.success) {
                    var msg = (r.data && r.data.message) ? r.data.message : 'Could not hold seats. Please try again.';
                    alert(msg);
                    return;
                }
                var holdKey = r.data.data.hold_key || r.data.data.holdKey || '';
                if (!holdKey) {
                    alert('Hold key not received. Please try again.');
                    return;
                }

                // Store minimal booking flow state
                sessionStorage.setItem('ems_booking_flow', JSON.stringify({
                    showtimeId: showtimeId,
                    seats: selectedSeats,
                    seatLabels: selectedSeats.map(function(s) { return s.rowLabel + s.seatNum; }),
                    totalPaise: totalAmt,
                    total: totalAmt,
                    holdKey: holdKey
                }));

                // Redirect to payment.html (within the same movies.html SPA view)
                window.location.href = 'payment.html';
            }).catch(function(e) {
                alert('Error holding seats. Please try again.');
                console.error('Hold seats error:', e);
            });
        }

        // Load seat layout from backend
        async function init() {
            if (!showtimeId) {
                document.getElementById('seatsContainer').innerHTML = '<p class="text-center text-red-500 py-8">Invalid showtime. Please go back.</p>';
                return;
            }

            var container = document.getElementById('seatsContainer');
            container.innerHTML = '<div class="text-center py-8"><div class="w-6 h-6 border-2 border-gray-100 border-t-custom-light rounded-full animate-spin mx-auto mb-2"></div><span class="text-gray-500 font-bold">Loading seats...</span></div>';

            try {
                var r = await EMS_API.movies.getSeatLayout(showtimeId);
                if (!r.ok || !r.data || !r.data.success) {
                    container.innerHTML = '<p class="text-center text-red-500 py-8">Could not load seat layout.</p>';
                    return;
                }
                seatLayoutData = normalizeSeatLayout(r.data.data);
                renderSeatLayout(seatLayoutData);
            } catch (e) {
                container.innerHTML = '<p class="text-center text-red-500 py-8">Failed to load seats. Please try again.</p>';
                console.error('Seat layout error:', e);
            }
        }

        function escapeHtml(unsafe) {
            return (unsafe || '').toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        init();
    </script>
</body>
</html>
