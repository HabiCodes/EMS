<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Cinema - EntryMySlot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }, colors: { custom: { light: '#FA580B', dark: '#0126A5' } } } }
        }
    </script>
    <style>
        .time-pill { border: 1px solid #e5e7eb; border-radius: 8px; padding: 6px 12px; font-size: 0.875rem; font-weight: 600; color: #111827; cursor: pointer; transition: all 0.2s; background: white; }
        .time-pill:hover { border-color: #FA580B; color: #FA580B; background: #fff5f0; }
        .time-pill.selected { background: #FA580B; color: white; border-color: #FA580B; }
        .time-pill.fast-filling { color: #d97706; border-color: #fcd34d; background: #fffbeb; }
        .time-pill:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900 min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <button onclick="history.back()" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 hover:bg-gray-200 transition"><i class="fa-solid fa-arrow-left"></i></button>
                <div>
                    <h1 id="headerMovieTitle" class="text-xl font-extrabold leading-tight">Loading...</h1>
                    <p id="headerMovieMeta" class="text-xs text-gray-500 font-medium">Loading...</p>
                </div>
            </div>
            <button onclick="showView('cinemasView')" class="hover:text-custom-light transition text-gray-600 bg-gray-100 w-8 h-8 flex items-center justify-center rounded-full"><i class="fa-solid fa-arrow-left"></i></button>
        </div>
    </header>

    <div class="bg-white border-b border-gray-200 sticky top-14 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-2 flex overflow-x-auto gap-3 hide-scrollbar" id="dateSelector">
            <!-- Populated by JS -->
        </div>
    </div>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-6 w-full">

        <div id="showtimeError" class="hidden text-center py-8">
            <p class="text-gray-500 font-medium">Could not load showtimes. Please go back and try again.</p>
            <button onclick="history.back()" class="mt-4 text-custom-light font-bold hover:underline">Go Back</button>
        </div>

        <div id="cinemasList" class="space-y-4">
            <!-- Cinema cards populated by JS -->
        </div>

        <div id="cinemasLoading" class="text-center py-8">
            <div class="w-6 h-6 border-2 border-gray-100 border-t-custom-light rounded-full animate-spin mx-auto mb-2"></div>
            <span class="text-gray-500 font-bold">Loading cinemas...</span>
        </div>

    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/movies.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('movie_id') || '';
        const movieTitle = decodeURIComponent(urlParams.get('title') || 'Selected Movie');
        const selectedDate = urlParams.get('date') || '';

        document.getElementById('headerMovieTitle').textContent = movieTitle;

        let currentCinemas = [];
        let currentShowtimes = [];
        let selectedDateStr = '';
        let cinemaDetailsCache = {};

        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        function formatDateStr(date) {
            return date.getDate() + ' ' + months[date.getMonth()];
        }

        function formatDateISO(date) {
            var y = date.getFullYear();
            var m = String(date.getMonth() + 1).padStart(2, '0');
            var d = String(date.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + d;
        }

        function renderDateSelector() {
            var container = document.getElementById('dateSelector');
            container.innerHTML = '';
            var today = new Date();
            today.setHours(0, 0, 0, 0);

            for (var i = 0; i < 5; i++) {
                var d = new Date(today);
                d.setDate(d.getDate() + i);
                var isToday = i === 0;
                var displayDay = isToday ? 'TODAY' : days[d.getDay()];
                var displayDate = d.getDate();
                var displayMonth = months[d.getMonth()];
                var isoDate = formatDateISO(d);

                var btn = document.createElement('button');
                btn.className = 'flex-shrink-0 flex flex-col items-center justify-center w-14 h-16 rounded-xl transition ' + (isToday ? 'bg-custom-light text-white shadow-md' : 'bg-white text-gray-600 hover:bg-gray-100');
                btn.dataset.date = isoDate;
                btn.innerHTML = '<span class="text-[10px] font-bold uppercase tracking-wider">' + displayDay + '</span><span class="text-lg font-extrabold leading-tight">' + displayDate + '</span><span class="text-[10px] font-medium">' + displayMonth + '</span>';

                btn.addEventListener('click', function() {
                    container.querySelectorAll('button').forEach(function(b) {
                        b.classList.remove('bg-custom-light', 'text-white', 'shadow-md');
                        b.classList.add('bg-white', 'text-gray-600');
                    });
                    btn.classList.remove('bg-white', 'text-gray-600');
                    btn.classList.add('bg-custom-light', 'text-white', 'shadow-md');
                    selectedDateStr = btn.dataset.date;
                    loadShowtimesForDate(selectedDateStr);
                });

                container.appendChild(btn);
            }

            selectedDateStr = selectedDate || formatDateISO(today);
        }

        async function loadCinemas() {
            if (!movieId) {
                document.getElementById('headerMovieMeta').textContent = 'No movie selected';
                return;
            }

            try {
                var r = await EMS_MOVIES.listCinemas({ pageSize: 100 });
                if (r.ok && r.data && r.data.success && Array.isArray(r.data.data)) {
                    currentCinemas = r.data.data;
                    cinemaDetailsCache = {};
                    currentCinemas.forEach(function(c) { cinemaDetailsCache[c.id] = c; });
                } else {
                    currentCinemas = [];
                }
            } catch (e) {
                console.error('Failed to load cinemas:', e);
                currentCinemas = [];
            }

            renderCinemas();
        }

        async function loadShowtimesForDate(date) {
            if (!movieId) return;

            document.getElementById('cinemasLoading').classList.remove('hidden');
            document.getElementById('cinemasList').innerHTML = '';
            document.getElementById('showtimeError').classList.add('hidden');

            try {
                var query = { movie_id: movieId };
                if (date) query.date = date;
                var r = await EMS_MOVIES.listShowtimes(query);
                if (r.ok && r.data && r.data.success && Array.isArray(r.data.data)) {
                    currentShowtimes = r.data.data;
                } else {
                    currentShowtimes = [];
                }
            } catch (e) {
                console.error('Showtime load error:', e);
                currentShowtimes = [];
            }

            renderCinemas();
        }

        function renderCinemas() {
            var container = document.getElementById('cinemasList');
            var loading = document.getElementById('cinemasLoading');

            loading.classList.add('hidden');

            if (currentCinemas.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-8">No cinemas available.</p>';
                return;
            }

            if (currentShowtimes.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-8">No showtimes available for the selected date.</p>';
                return;
            }

            var cinemasWithShowtimes = currentCinemas.filter(function(cinema) {
                return currentShowtimes.some(function(st) { return String(st.cinema_id) === String(cinema.id); });
            });

            if (cinemasWithShowtimes.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-8">No cinemas have showtimes for the selected date.</p>';
                return;
            }

            cinemasWithShowtimes.forEach(function(cinema) {
                var cinemaShowtimes = currentShowtimes.filter(function(st) {
                    return String(st.cinema_id) === String(cinema.id);
                });

                var timesHtml = '';
                cinemaShowtimes.forEach(function(st) {
                    var isAvailable = st.status
                        ? ['on_sale', 'available', 'active'].indexOf(st.status) !== -1
                        : Number(st.available_seats || 0) > 0;
                    var timeLabel = formatShowtime(st.show_datetime || st.show_time || st.start_time) || 'TBD';
                    var availableSeats = st.available_seats || 0;
                    var extraClass = availableSeats <= 10 && availableSeats > 0 ? 'fast-filling' : '';

                    if (!isAvailable) {
                        timesHtml += '<button disabled class="time-pill opacity-40 line-through">' + escapeHtml(timeLabel) + '</button>';
                    } else {
                        timesHtml += '<button onclick="selectTime(decodeURIComponent(\'' + encodeURIComponent(cinema.name || 'Cinema') + '\'), decodeURIComponent(\'' + encodeURIComponent(timeLabel) + '\'), decodeURIComponent(\'' + encodeURIComponent(String(st.id || st.showtime_id || '')) + '\'), decodeURIComponent(\'' + encodeURIComponent(selectedDateStr || st.show_date || '') + '\'))" class="time-pill ' + extraClass + '">' + escapeHtml(timeLabel) + '</button>';
                    }
                });

                var facilitiesHtml = '';
                if (cinema.facilities && cinema.facilities.length > 0) {
                    facilitiesHtml = cinema.facilities.map(function(f) {
                        return '<span class="text-[10px] text-green-600 font-bold flex items-center gap-1"><i class="fa-solid fa-check text-[8px]"></i> ' + escapeHtml(f) + '</span>';
                    }).join('');
                }

                var card = '<div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row gap-4 md:items-center">' +
                    '<div class="md:w-1/3">' +
                        '<h3 class="font-extrabold text-lg text-gray-900 flex items-center gap-2"><i class="fa-regular fa-heart text-gray-300 hover:text-red-500 cursor-pointer transition"></i> ' + escapeHtml(cinema.name || cinema.display_name || 'Cinema') + '</h3>' +
                        '<div class="flex flex-wrap gap-3 mt-2">' + facilitiesHtml + '</div>' +
                    '</div>' +
                    '<div class="md:w-2/3">' +
                        '<div class="flex flex-wrap gap-3">' + timesHtml + '</div>' +
                    '</div>' +
                '</div>';

                container.innerHTML += card;
            });
        }

        function formatShowtime(isoStr) {
            if (!isoStr) return '';
            var timeOnly = String(isoStr).match(/^(\d{1,2}):(\d{2})/);
            if (timeOnly) {
                var hour = Number(timeOnly[1]);
                var suffix = hour >= 12 ? 'PM' : 'AM';
                return (hour % 12 || 12) + ':' + timeOnly[2] + ' ' + suffix;
            }
            try {
                var d = new Date(isoStr);
                if (isNaN(d.getTime())) return String(isoStr);
                var h = d.getHours();
                var m = String(d.getMinutes()).padStart(2, '0');
                var ampm = h >= 12 ? 'PM' : 'AM';
                h = h % 12 || 12;
                return h + ':' + m + ' ' + ampm;
            } catch (e) {
                return isoStr;
            }
        }

        function selectTime(cinemaName, timeLabel, showtimeId, dateStr) {
            var d = selectedDateStr ? new Date(selectedDateStr + 'T00:00:00') : new Date();
            var dateDisplay = formatDateStr(d);
            var url = 'seats.html?movie=' + encodeURIComponent(movieTitle) +
                '&cinema=' + encodeURIComponent(cinemaName) +
                '&time=' + encodeURIComponent(timeLabel) +
                '&date=' + encodeURIComponent(dateDisplay) +
                '&showtime_id=' + encodeURIComponent(showtimeId);
            window.location.href = url;
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return str.toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Init
        if (movieId) {
            renderDateSelector();
            Promise.all([
                loadCinemas(),
                loadShowtimesForDate(selectedDateStr)
            ]).catch(function(e) {
                console.error('Movie show selection initialization failed:', e);
            });
        } else {
            document.getElementById('cinemasLoading').classList.add('hidden');
            document.getElementById('cinemasList').innerHTML = '<p class="text-center text-red-500 py-8">No movie selected. Please go back.</p>';
        }
    </script>
</body>
</html>
